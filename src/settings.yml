---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.4.4
serverless_language: python
refresh_interval_floor: ''
polling_url: https://raw.githubusercontent.com/michaelkurath/TRMNL-Esperanto/main/data/{% if trmnl.plugin_settings.custom_fields_values.lesson_frequency == 'every_refresh' %}refresh{% else %}today{% endif %}.json
polling_headers: ''
polling_body: ''
id: 531807
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
custom_fields:
- keyname: author_bio
  name: About Esperanto
  field_type: author_bio
  category: education,discovery
  description: |-
    Esperanto is an international language created by L. L. Zamenhof and first published in 1887. It was designed to make communication easier between people who speak different languages.
    On TRMNL, learn a word or expression with an example sentence and a short note. Choose Learn for vocabulary and grammar, Discover for idioms and culture, or Mixed for both. Lessons are available at three levels, with translations in English, German, Spanish and French.
  github_url: https://github.com/michaelkurath/TRMNL-Esperanto
  learn_more_url: https://en.wikipedia.org/wiki/Esperanto
- keyname: content_mode
  name: Content mode
  field_type: select
  options:
  - Mixed: mixed
  - Learn: learn
  - Discover: discover
  default: mixed
  optional: true
  description: Alternate between lessons and discoveries or choose one format.
- keyname: lesson_frequency
  name: New lesson
  field_type: select
  options:
  - Daily: daily
  - Every refresh: every_refresh
  default: daily
  optional: true
  description: Show one lesson per day or advance on each plugin refresh.
- keyname: translation_language
  name: Translation language
  field_type: select
  options:
  - English: en
  - Deutsch: de
  - Español: es
  - Français: fr
  default: en
  optional: true
- keyname: difficulty
  name: Difficulty
  field_type: select
  options:
  - Beginner: beginner
  - Intermediate: intermediate
  - Advanced: advanced
  default: beginner
  optional: true
name: Esperanto
description: Learn a little Esperanto daily.
refresh_interval: 60
